---
# Source: ssd/templates/supplychain-preprocessor/ssd-preprocessor-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplychain-preprocessor
  labels:
    app: ssd
    component: supplychain-preprocessor
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssd
      component: supplychain-preprocessor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ssd
        component: supplychain-preprocessor
        heritage: "Helm"
        release: "ssd"
        chart: "ssd-2024.12.00"
      annotations:
    spec:
      initContainers:
      - name: rabbitmq-check
        image: quay.io/opsmxpublic/pgchecker:v1
        command:
          - sh
          - -c
          - |
            echo 'Waiting for RABBITMQ-SERVICE to become ready...'
            until printf "." && nc -z -w 2 rabbitmq-service 5672; do
               sleep 2;
            done;
            echo 'RABBITMQ-SERVICE OK ✓'
      containers:
      - name: supplychain-preprocessor
        image: quay.io/opsmxpublic/supplychain-preprocessor:2024-12-00
        envFrom:
        - configMapRef:
            name: ssd-proxy-certs
            optional: true
        volumeMounts:
        - mountPath: /etc/ssd-public-keys
          name: ssd-public-keys
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/config
          name: preprocessor-volume
        - mountPath: /etc/secrets/
          name: ssdsecret
          readOnly: true
        - mountPath: /etc/secrets/supplychain-preprocessor-token/
          name: token
          readOnly: true
        - mountPath: /usr/local/share/ca-certificates
          name: custom-certs
        - mountPath: /app/scanResult
          name: scanresult
        - mountPath: /app/grypeDB
          name: grypedb
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 8058
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault


      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: ssd-public-keys
        name: ssd-public-keys
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: scanresult
      - emptyDir: {}
        name: grypedb
      - name: preprocessor-volume
        secret:
          secretName: supplychain-preprocessor
      - name: ssdsecret
        secret:
          defaultMode: 420
          items:
          - key: AESEncryptionKey
            path: ssdsecret/AESEncryptionKey
          secretName: ssdsecret
      - name: ssd-proxy-certs
        configMap:
          defaultMode: 420
          optional: true
          name: ssd-proxy-certs
      - name: token
        secret:
          defaultMode: 420
          secretName: supplychain-preprocessor-token
      - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
        configMap:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          optional: true
          name: customer-custon-ca
