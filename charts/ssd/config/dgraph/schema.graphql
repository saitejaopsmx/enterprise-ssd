        { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    )
{
    id: ID!
    agentId: String! @id @search(by: [exact])
    clusterName: String! @search(by: [exact, term])
    namespace: String @search(by: [exact])
    version: String
    state: ShieldAgentState! @search(by: [exact])
    capabilities: [String]
    labels: [KeyValue]
    activeScanCount: Int
    completedScanCount: Int
    failedScanCount: Int
    lastHeartbeat: DateTime @search
    connectedAt: DateTime @search
    disconnectedAt: DateTime
    team: Team! @hasInverse(field: shieldAgents)
    createdAt: DateTime!
    updatedAt: DateTime!
    roles: [Role]
}

