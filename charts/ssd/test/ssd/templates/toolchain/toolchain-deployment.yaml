---
# Source: ssd/templates/toolchain/toolchain-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssd
    component: toolchain
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
  name: tool-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssd
      component: toolchain
  template:
    metadata:
      labels:
        app: ssd
        component: toolchain
      annotations:
    spec:
      initContainers:
      - name: temporalfrontend-check
        image: quay.io/opsmxpublic/pgchecker:v1
        command:
          - sh
          - -c
          - |
            echo 'Waiting for TEMPORAL-FRONTEND to become ready...'
            until printf "." && nc -z -w 2 ssd-temporal-frontend 7233; do
               sleep 2;
            done;
            echo 'TEMPORAL-FRONTEND OK ✓'
      containers:
        - name: tool-chain
          image: quay.io/opsmxpublic/tool-chain:2024-12-00
          env:
          - name: GRAPHQL_URL
            value: http://dgraph-public:8080/graphql
          - name: S3_ENDPOINT_URL
            value: http://ssd-minio:9000/
          - name: TEMPORAL_HOSTPORT
            value: ssd-temporal-frontend:7233
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: accesskey
                name: ssd-minio
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: secretkey
                name: ssd-minio
          - name: Cypher_Key
            valueFrom:
              secretKeyRef:
                key: AESEncryptionKey
                name: ssdsecret
          - name: MOBSF_APIKEY
            valueFrom:
              secretKeyRef:
                key: MOBSF_API_KEY
                name: mobsf-secret
          envFrom:
          - configMapRef:
              name: ssd-proxy-certs
              optional: true
          ports:
            - containerPort: 8100
              protocol: TCP
          volumeMounts:
            - name: scanresult
              mountPath: /tools/scanResult
            - name: tool-chain-volume
              mountPath: /tools/config/tool-chain.yaml
              subPath: tool-chain.yaml
            - mountPath: /tools/ssd-public-keys
              name: ssd-public-keys
            - mountPath: /tools/secrets/tool-chain
              name: token
              readOnly: true
            - mountPath: /usr/local/share/ca-certificates
              name: custom-certs
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8100
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          securityContext: {}
      volumes:
        - name: scanresult
          emptyDir: {}
        - name: tool-chain-volume
          configMap:
            name: tool-chain
            items:
              - key: tool-chain.yaml
                path: tool-chain.yaml
            defaultMode: 420
        - name: ssd-proxy-certs
          configMap:
            defaultMode: 420
            optional: true
            name: ssd-proxy-certs
        - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
          configMap:
            defaultMode: 420
            items:
            - key: ca.crt
              path: ca.crt
            optional: true
            name: customer-custon-ca
        - name: token
          secret:
            defaultMode: 420
            optional: true
            secretName: tool-chain-token
        - name: ssd-public-keys
          configMap:
            defaultMode: 420
            name: ssd-public-keys
      restartPolicy: Always
