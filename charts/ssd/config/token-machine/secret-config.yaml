signingKeys:
  publicKeyConfigmapName: ssd-public-keys
  secretKeyNamePrefix: jwtrsa
  regenerateInterval: 15768000
  keyLengthBits: 2048
managedSecrets:
  regenerateInterval: {{ .Values.tokenmachine.regenerateInterval }} # seconds
  secrets:
    - name: ssd-gate-token # the k8s name for this token
      serviceName: ssd-gate
      authorizations:
        - generate-user-token
    - name: supplychain-api-token
      serviceName: supplychain-api
      authorizations:
        - generate-serviceaccount-token
        - access-dgraph
    - name: ssd-opa-token
      serviceName: ssd-opa
      authorizations:
        - access-dgraph
    - name: tool-chain-token
      serviceName: tool-chain
      authorizations:
        - access-dgraph
    - name: iacscan-service-token
      serviceName: iacscan-service
      authorizations:
        - access-dgraph
    - name: supplychain-preprocessor-token
      serviceName: supplychain-preprocessor
      authorizations:
        - access-dgraph
    - name: snyk-monitor-secret
      serviceName: snyk-monitor
      authorizations:
        - access-dgraph
    - name: source-scan-token
      serviceName: source-scan-service
      authorizations:
        - access-dgraph
    - name: project-monitor-token
      serviceName: project-monitor
      authorizations:
        - access-dgraph
    - name: ssd-rescheduler-token
      serviceName: ssd-rescheduler
      authorizations:
        - access-dgraph
    - name: artifact-scan-token
      serviceName: artifact-scan
        - access-dgraph
    - name: ssd-audit-service-token
      serviceName: ssd-audit-service
        - access-dgraph
    - name: hasura-token
      serviceName: hasura
        - access-dgraph
