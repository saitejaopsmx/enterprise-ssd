# Source: ssd/templates/rabbitmq/ssd-rabbitmq-service.yaml
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssd
    component: ssd-rabbitmq
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
  name: rabbitmq-service
spec:
  type: LoadBalancer
  ports:
  - name: rabbitmq
    port: 5672
    protocol: TCP
    targetPort: 5672
  - name: rabbitmq-mgmt
    port: 15672
    protocol: TCP
    targetPort: 15672
  selector:
    app: ssd
    component: ssd-rabbitmq
