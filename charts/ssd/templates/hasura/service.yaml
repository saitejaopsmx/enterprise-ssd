apiVersion: v1
kind: Service
metadata:
  name: hasura-service
  labels:
    app: ssd
    component: hasura
{{ include "ssd.standard-labels" . | indent 4 }}
{{- if .Values.hasura.serviceAnnotations }}
  annotations:
{{ toYaml .Values.hasura.serviceAnnotations | indent 4 }}
{{- end }}
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: ssd
    component: hasura
