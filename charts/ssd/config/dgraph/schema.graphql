type SchemaVersion {
    version: String!
}

interface RBAC {
    roles: [Role!]
}

enum RolePermission {
    admin
    "adhoc perms"
    adhoc_create_delete
    adhoc_update
    adhoc_trigger_scan
    "integrator perms"
    integrator_create_delete
    integrator_update
    integrator_toggle
    "policies perms"
    policy_update
    "exception perms"
    exception_add
    exception_update
    "report subscription perms"
    report_subscription_create_delete
    report_subscription_update
    "alerts perms"
    alert_update
    "cluster perms"
    cluster_add
    cluster_update
    "component license perms"
    component_license_update
    "team perms"
    team_manage
    "read perms"
    read
}

type Role {
    "id is randomly assigned"
    id: String! @id
    "group should be a URI format that includes a scope or realm"
    group: String! @search(by: [hash])
    permission: [RolePermission!] @search(by: [hash])
}


enum ApiKeyStatus {
    active
    inactive
    expired
}

type ApiKey
    @withSubscription
    @auth(
    query:
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    add:
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    update:
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    delete:
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    )
{
    id: String! @id
    name: String! @search(by: [exact, regexp])
    role: Role!
    keyHash: String! @search(by: [hash])
    createdAt: DateTime! @search
    updatedAt: DateTime! @search
    expiresAt: DateTime! @search
    status: ApiKeyStatus! @search(by: [hash])
}

"""
KeyValue is a generic key/value pair, used as an attribute list or similar.
"""
type KeyValue {
    id: String! @id
    name: String! @search(by: [exact, regexp])
    value: String! @search(by: [exact, regexp])
    createdAt: DateTime! @search
}


type Organization implements RBAC
    @withSubscription
    @auth(
    query: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryOrganization @cascade { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle,adhoc_create_delete,adhoc_update,adhoc_trigger_scan,exception_add,exception_update,cluster_add,cluster_update,component_license_update,team_manage,alert_update,policy_update,report_subscription_create_delete,report_subscription_update,read]}}) { __typename }}}"},
{ rule: "query($groups: [String!]) { queryOrganization @cascade { teams { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle,adhoc_create_delete,adhoc_update,adhoc_trigger_scan,exception_add,exception_update,cluster_add,cluster_update,component_license_update,team_manage,alert_update,policy_update,report_subscription_create_delete,report_subscription_update,read]}}) { __typename }}}}"},
{ rule: "query($groups: [String!]) { queryOrganization @cascade { teams { applications { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle,adhoc_create_delete,adhoc_update,adhoc_trigger_scan,exception_add,exception_update,cluster_add,cluster_update,component_license_update,team_manage,alert_update,policy_update,report_subscription_create_delete,report_subscription_update,read]}}) { __typename }}}}}"},
    ]},
    add: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryOrganization @cascade { roles(filter: {group: {in: $groups}, permission: {in: [admin]}}) { __typename }}}"},
    ]},
    update: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryOrganization @cascade { roles(filter: {group: {in: $groups}, permission: {in: [admin]}}) { __typename }}}"},
    ]},
    delete:
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
            )
{
    "id is randomly assigned"
    id: String! @id
    name: String! @search(by: [exact])
    roles: [Role!]
    teams: [Team!] @hasInverse(field: organization)
    environments: [DeploymentTarget!] @hasInverse(field: organization)
    policies: [PolicyDefinition!] @hasInverse(field: ownerOrg)
    policyEnforcements: [PolicyEnforcement!]
    integrators: [Integrator!] @hasInverse(field: organization)
    integratorConfigs: [IntegratorConfigs!] @hasInverse(field: organization)
    resources: [AbstractResource!] @hasInverse(field: organization)
    projects: [Project!] @hasInverse(field: organization)
    licenses: [ComponentLicenses!] @hasInverse(field: organization)
    exceptions: [ExceptionAffects!] @hasInverse(field: affectsOrg)
    reportSubscriptions: [ReportSubscriptionAffects!] @hasInverse(field: affectsOrg)
}

"""
Environment can be things like dev, prod, staging etc.
"""
type Environment {
    id: String! @id
    organization: Organization!
    purpose: String! @search(by: [exact,regexp])
    integratorConfigs: [IntegratorConfigs!] @hasInverse(field: environment)
}

"""
DeploymentTarget describes a single place that things can be deployed into,
such as an AWS account or a Kubernetes cluster.
"""
type DeploymentTarget
    @auth(
    query: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryDeploymentTarget @cascade { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,cluster_add,cluster_update,read]}}) { __typename }}}}"},
{ rule: "query($groups: [String!]) { queryDeploymentTarget @cascade { organization { teams { roles(filter: {group: {in: $groups}, permission: {in: [admin,cluster_add,cluster_update,read]}}) { __typename }}}}}"},
    ]},
    add: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryDeploymentTarget @cascade { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,cluster_add]}}) { __typename }}}}"},
    ]},
    update: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryDeploymentTarget @cascade { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,cluster_add,cluster_update]}}) { __typename }}}}"},
    ]},
    delete:
            { rule: "{$type: {eq: \"internal-account/v1\"}}" }
            )
{
   "id is randomly assigned"
    id: String! @id
    name: String! @search(by: [exact, regexp])
    "this would be the ip/server address of the target environment"
    ip: String! @search(by: [exact])
    "expected value is kubernetes or non-kubernetes"
    targetType: String @search(by: [exact])
    "Options are: self-hosted(default), aws"
    hosting: String @search(by: [exact])
    "Options are: ecs,ec2,etc (Options should be based in the hosting type)"
    hostingService: String @search(by: [exact])
    "Account name from the cloud provider integrator is expected here"
    account: String @search(by: [exact])
    "this would be something like us-east-1 etc"
    region: String @search(by: [exact])
    kubescapeServiceConnected: String
    kubescapeLatestFileTS: String
    isFirewall: Boolean
    organization: Organization! @hasInverse(field: environments)
    defaultEnvironment: Environment!
    nodes: [DeploymentTargetNode!] @hasInverse(field: deploymentTarget)
}

"""
DeploymentTargetNode is an individual node within a DeploymentTarget (cluster).
Node details are captured during the event call from the kube detector to the
preprocessor and enrich the cluster information.
"""
type DeploymentTargetNode
    @auth(
    query: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryDeploymentTargetNode @cascade { deploymentTarget { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,cluster_add,cluster_update,read]}}) { __typename }}}}}"},
{ rule: "query($groups: [String!]) { queryDeploymentTargetNode @cascade { deploymentTarget { organization { teams { roles(filter: {group: {in: $groups}, permission: {in: [admin,cluster_add,cluster_update,read]}}) { __typename }}}}}}"},
    ]},
    add:    { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    update: { rule: "{$type: {eq: \"internal-account/v1\"}}" },
    delete: { rule: "{$type: {eq: \"internal-account/v1\"}}" }
    )
{
    "id is randomly assigned"
    id: String! @id
    "node name as reported by the cluster"
    name: String! @search(by: [exact, regexp])
    "the cluster this node belongs to"
    deploymentTarget: DeploymentTarget! @hasInverse(field: nodes)
    "node machine id (node.Status.NodeInfo.MachineID)"
    machineID: String @search(by: [exact])
    kubeletVersion: String
    "node labels captured from the detector"
    labels: [KeyValue!]
    "node annotations captured from the detector"
    annotations: [KeyValue!]
}


type Team implements RBAC
    @withSubscription
    @auth(
    query: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
