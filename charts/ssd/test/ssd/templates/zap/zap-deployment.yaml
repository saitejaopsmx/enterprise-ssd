---
# Source: ssd/templates/zap/zap-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssd
    component: zap
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
  name: zap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssd
      component: zap
  template:
    metadata:
      annotations:
      labels:
        app: ssd
        component: zap
    spec:
      containers:
      - image: quay.io/opsmxpublic/zap:2024-12-00
        name: zap
        command:
          - /zap/zap.sh
          - '-daemon'
          - '-host'
          - 0.0.0.0
          - '-port'
          - '8080'
          - '-config'
          - api.disablekey=true
          - '-config'
          - api.addrs.addr.name=.*
          - '-config'
          - api.addrs.addr.regex=true
        env:
        - name: ZAP_API_ADDRESSES
          value: '*'
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: auth-script
          mountPath: /tmp/Form-Based-Auth.js
          subPath: Form-Based-Auth.js
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - configMap:
          defaultMode: 420
          name: zap-auth-script
        name: auth-script
