apiVersion: v1
kind: Service
metadata:
  name: prism-iac
  labels:
    app: ssd
    component: prism-iac
{{ include "ssd.standard-labels" . | indent 4 }}
{{- if .Values.prismiac.serviceAnnotations }}
  annotations:
{{ toYaml .Values.prismiac.serviceAnnotations | indent 4 }}
{{- end }}
spec:
  ports:
    - name: prism-iac
      protocol: TCP
      port: 8400
      targetPort: 8400
      {{- if eq .Values.k8sServiceType "NodePort" }}
      nodePort: 8400
      {{- end }}
  selector:
    app: ssd
    component: prism-iac
