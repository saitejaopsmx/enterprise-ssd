rabbitmq:
  queue: bitbucket-ssd
  exchange: bitbucket.events
  bindingKey: bitbucket-ssd
  prefetchCount: 50

graphql:
  {{- if .Values.dgraph.HA.enabled }}
  host: http://dgraph-alpha-public
  {{- else }}
  host: http://dgraph-public
  {{- end }}
  port: 8080

ssdopasvc:
  host: http://ssd-opa
  port: 8200
