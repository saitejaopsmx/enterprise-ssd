{ rule: "query($groups: [String!]) { queryIntegrator @cascade { organization { teams { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle]}}) { __typename }}}}}"},
{ rule: "query($groups: [String!]) { queryIntegrator @cascade { organization { teams { applications { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle]}}) { __typename }}}}}}"},
