apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplychain-api
  labels:
    app: ssd
    component: supplychain-api
{{ include "ssd.standard-labels" . | indent 4 }}
  name: supplychain-api
spec:
  replicas: {{ .Values.supplychainapi.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: supplychain-api
  template:
    metadata:
      labels:
        app: ssd
        component: supplychain-api
{{ include "ssd.standard-labels" . | indent 8 }}
      annotations:
{{- if .Values.supplychainapi.annotations -}}
        {{ toYaml .Values.supplychainapi.annotations | nindent 8 }}
{{- end }}
    spec:
      {{- if not .Values.global.minio.enabled }}
      serviceAccountName: ssd-storage-sa
      {{- end }}
      initContainers:
      - name: rabbitmq-check
        image: {{ .Values.global.customImages.registry }}/pgchecker:v1
        command:
          - sh
          - -c
          - |
            echo 'Waiting for RABBITMQ-SERVICE to become ready...'
            until printf "." && nc -z -w 2 rabbitmq-service 5672; do
               sleep 2;
            done;
            echo 'RABBITMQ-SERVICE OK ✓'
      containers:
        - name: supplychain-api
          image: {{ template "supplychainapi.image" . }}
          ports:
            - containerPort: 8099
              protocol: TCP
          env:
          {{- if .Values.global.minio.enabled }}
          - name: S3_ENDPOINT_URL
            value: http://{{ .Release.Name }}-minio:9000/
          {{- else }}
          - name: S3_ENDPOINT_URL
            value: {{ .Values.s3bucketurl }}
          - name: S3_Region
            value: {{ .Values.s3region }}
          {{- end }}
          {{- if .Values.global.minio.enabled }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: accesskey
                name: {{ .Release.Name }}-minio
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: secretkey
                name: {{ .Release.Name }}-minio
          {{- else if and (eq .Values.toolchain.iamrole false) (not .Values.global.minio.enabled) }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: accesskey
                name: ssd-storage-secret
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: secretkey
                name: ssd-storage-secret
          {{- end }}
          - name: Cypher_Key
            valueFrom:
              secretKeyRef:
                key: AESEncryptionKey
                name: ssdsecret
          envFrom:
          - configMapRef:
              name: ssd-proxy-certs
              optional: true
          {{- with .Values.supplychainapi.probes }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8099
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /healthz
              port: 8099
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          {{- end }}
          volumeMounts:
            - mountPath: /app/ssd-public-keys
              name: ssd-public-keys
            - name: supplychain-api-volume
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml
            - mountPath: /app/ssd-integrations.yaml
              name: supplychain-api-cm
              subPath: ssd-integrations.yaml
            - mountPath: /app/secrets/
              name: ssdsecret
              readOnly: true
            - mountPath: /usr/local/share/ca-certificates
              name: custom-certs
            - mountPath: /app/secrets/supplychain-api-token/
              name: token
              readOnly: true
            - mountPath: /app/zapOpenApiSpec
              name: zap-openapi-spec
            - mountPath: /app/policy
              name: policy
          {{- with .Values.supplychainapi.resources }}
          resources:
            {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
      {{- if .Values.supplychainapi.securityContext }}
      {{ toYaml .Values.supplychainapi.securityContext | nindent 12 }}
      {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
        - name: gotenberg
          image: gotenberg/gotenberg:8.7.0
          command: ["gotenberg"]
          args: ["--api-port=3000"]
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - emptyDir: {}
          name: zap-openapi-spec
        - emptyDir: {}
          name: policy
        - configMap:
            defaultMode: 420
            name: ssd-public-keys
          name: ssd-public-keys
        - name: supplychain-api-volume
          secret:
            secretName: supplychain-api
            items:
              - key: app-config.yaml
                path: app-config.yaml
            defaultMode: 420
        - configMap:
            defaultMode: 420
            items:
            - key: ssd-integrations.yaml
              path: ssd-integrations.yaml
            name: supplychain-api-cm
          name: supplychain-api-cm
        - name: ssdsecret
          secret:
            defaultMode: 420
            items:
            - key: AESEncryptionKey
              path: ssdsecret/AESEncryptionKey
            secretName: ssdsecret
        - name: ssd-proxy-certs
          configMap:
            defaultMode: 420
            optional: true
            name: ssd-proxy-certs
        - name: token
          secret:
            defaultMode: 420
            secretName: supplychain-api-token
        - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
          configMap:
            defaultMode: 420
            items:
            - key: ca.crt
              path: ca.crt
            optional: true
            name: customer-custon-ca
