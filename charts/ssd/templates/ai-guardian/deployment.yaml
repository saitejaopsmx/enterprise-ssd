apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-guardian-remediation
  labels:
    app: ssd
    component: ai-guardian-remediation
{{ include "ssd.standard-labels" . | indent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: ai-guardian-remediation
  template:
    metadata:
      annotations:
{{- if .Values.airemediation.annotations -}}
        {{ toYaml .Values.airemediation.annotations | nindent 8 }}
{{- end }}
      labels:
        app: ssd
        component: ai-guardian-remediation
{{ include "ssd.standard-labels" . | indent 8 }}
    spec:
      containers:
      - image: {{ template "airemediation.image" . }}
        name: ai-guardian-remediation
        env:
        - name: CLAUDE_CODE_MODEL
          valueFrom:
            secretKeyRef:
              name: ai-guardian-remediation-secret
              key: claude-code-model
              optional: true
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-guardian-remediation-secret
              key: claude-code-token
              optional: true
        - name: REMEDIATION_AGENT
          valueFrom:
            secretKeyRef:
              name: ai-guardian-remediation-secret
              key: agent
              optional: true
      {{- with .Values.airemediation.probes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.airemediation.resources }}
        resources:
      {{- toYaml . | nindent 10 }}
      {{- end }}
        securityContext:
      {{- if .Values.airemediation.securityContext }}
      {{ toYaml .Values.airemediation.securityContext | nindent 10 }}
      {{- end }}
      {{- if .Values.imagePullSecret}}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret}}
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.global.affinity }}
      affinity:
{{ toYaml .Values.global.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
{{ toYaml .Values.global.tolerations | indent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
