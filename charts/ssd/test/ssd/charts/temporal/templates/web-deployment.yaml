---
# Source: ssd/charts/temporal/templates/web-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-temporal-web
  labels:
    app.kubernetes.io/name: temporal
    helm.sh/chart: temporal-0.22.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: ssd
    app.kubernetes.io/version: 1.20.3
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: ssd
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        helm.sh/chart: temporal-0.22.1
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: ssd
        app.kubernetes.io/version: 1.20.3
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: temporal
    spec:
      
      volumes:
        - name: temporal-web-config
          configMap:
            name: ssd-temporal-web-config
      containers:
        - name: temporal-web
          image: "quay.io/opsmxpublic/temporal-ui:2.9.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: "ssd-temporal-frontend.argo-test.svc:7233"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {}
