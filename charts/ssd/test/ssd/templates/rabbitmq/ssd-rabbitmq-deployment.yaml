---
# Source: ssd/templates/rabbitmq/ssd-rabbitmq-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssd
    component: ssd-rabbitmq
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssd
      component: ssd-rabbitmq
  template:
    metadata:
      annotations:
      labels:
        app: ssd
        component: ssd-rabbitmq
        heritage: "Helm"
        release: "ssd"
        chart: "ssd-2024.12.00"
    spec:
      containers:
      - image: quay.io/opsmxpublic/rabbitmq:3-management
        imagePullPolicy: IfNotPresent
        name: rabbitmq
        env:
        envFrom:
        - configMapRef:
            name: ssd-proxy-certs
            optional: true
        ports:
        - containerPort: 5672
          protocol: TCP
        resources: {}
        volumeMounts:
        - mountPath: /usr/local/share/ca-certificates
          name: custom-certs
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      volumes:
      - name: ssd-proxy-certs
        configMap:
          defaultMode: 420
          optional: true
          name: ssd-proxy-certs
      - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
        configMap:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          optional: true
          name: customer-custon-ca
