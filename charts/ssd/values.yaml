#####################################################

# OpsMx Secure Software Delivery
#####################################################
## Info related to registry where OES images are stored
imageCredentials:
  repoUrl: https://quay.io/
  # Update this is using a private repo such as ACR, ECR, GCR, JFrog, etc.
  registry: quay.io/opsmxpublic

### The below parameter is used for SSD-DB,Tool Chain and Dgraph ####
storageClass:
# noPvc is true, no PVCs will be created, suitable for minikube
noPvc: false
####################################################
## Redis configuration
## Set it to false only if SSD needs to be configured with external redis
installRedis: true
###################################################
### Default is ClusterIP can be changed to NodePort or LoadBalancer
### Below parameter applies to SSD-OPA,API,Preprocessor,Tool chain,Token Machine and ZAP.
k8sServiceType: ClusterIP

#### SSD-UI Service Type default is ClusterIP, can be changed to LoadBalancer,NodePort
UIServiceType: ClusterIP
#### Rabbit MQ Service Type , default is LB, can be changed to ClusterIP,NodePort
RabbitServiceType: LoadBalancer

#################################################
## Change the Organisation name if user wants a different name in the UI
organisationname: default

## Admin Groups for Rbac #######################
admingroups: admin

#############################################################################
# Update the Prometheus Ingress Url ########################################
prometheusUrl: Promethues.ingress.url.com

#############################################################################
# Update the ElasticSearch Ingress Url ########################################
elasticsearchUrl: https://ElasticSearch.ingress.url.com
###############################################################################
### Update the below parameters only if minio.enabled is false ########
### Update the S3 Bucket REGION in AWS #######################################
s3region: awsregion
s3bucketurl: https://s3bucketname.s3.awsregion.amazonaws.com
####################################################
## Change this true if user need to enable the AIModel Scan ###################
## If it is true AI Shield and DLVS Services will be installed ###############
installAimlSvcs: false
####################################################
# Global variables can be accessed across all the charts including sub-charts
global:
  #imageRegistry: quay.io
  security:
    allowInsecureImages: true
  # when this flag is set to false; UI will be accessible over http instead of https
  # This does not appear to be used at all
  #ssl:
  #  enabled: false

  # If cert-manager is installed, TLS secrets will created automatically, as an 'Issuer' will be created
  # Else, the TLS secrets will need to created manually
  certManager:
    installed: false

  customCerts:
    enabled: false        # Set to true if your organization requires custom TLS certs
    secretName: oes-cacerts # Please do not change this

  ## Set to true to expose ssd-ui over ingress
  createIngress: false

  ##
  gkeworkload: true

  ## SSD-UI url configuration, defaults to http://localhost:8080
  ssdUI:
    protocol: http
    host: localhost
    ## PathType for Ingress Controller will be ImplementationSpecific, for AWS Ingress it will be Prefix
    pathType: ImplementationSpecific
    # Use below port when hostname above is an external IP instead of a hostname
    #port: 8080

    ingress:
      tls:
        secretName: ssd-ui-ingress
