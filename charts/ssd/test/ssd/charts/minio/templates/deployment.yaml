---
# Source: ssd/charts/minio/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-minio
  labels:
    app: minio
    chart: minio-8.0.9
    release: ssd
    heritage: Helm
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: minio
      release: ssd
  template:
    metadata:
      name: ssd-minio
      labels:
        app: minio
        release: ssd
      annotations:
        checksum/secrets: 97076cc0c115f888442ce70958321e799c546da992ecbf3d3e1aefa163fee5a9
        checksum/config: 3d509542dc66aae8215d93560f6d31b849a5701681756b885c42cc41ca370fa0
    spec:
      serviceAccountName: "ssd-minio"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: "quay.io/opsmxpublic/minio:RELEASE.2020-12-03T05-49-24Z"
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-ce"
            - "/usr/bin/docker-entrypoint.sh minio -S /etc/minio/certs/ server /export"
          volumeMounts:
            - name: export
              mountPath: /export            
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ssd-minio
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ssd-minio
                  key: secretkey
          resources:
            requests:
              memory: 4Gi      
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: ssd-minio
        - name: minio-user
          secret:
            secretName: ssd-minio
