{{- $s := .Values.aiSecrets.airemediation }}
{{- if and $s.create (not $s.existingSecret) (ne $s.oauthToken "REPLACE_ME") (ne $s.databaseUrl "REPLACE_ME") }}
apiVersion: v1
kind: Secret
metadata:
  name: ai-guardian-remediation-secret
  labels:
    app: ssd
    component: ai-guardian-remediation
{{ include "ssd.standard-labels" . | indent 4 }}
type: Opaque
stringData:
  CLAUDE_CODE_MODEL: {{ $s.model | quote }}
  REMEDIATION_AGENT: {{ $s.agent | quote }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ $s.oauthToken | quote }}
  DATABASE_URL: {{ $s.databaseUrl | quote }}
{{- end }}
