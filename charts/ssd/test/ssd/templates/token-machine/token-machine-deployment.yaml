---
# Source: ssd/templates/token-machine/token-machine-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-machine
  labels:
    app: ssd
    component: token-machine
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssd
      component: token-machine
  template:
    metadata:
      labels:
        app: ssd
        component: token-machine
        heritage: "Helm"
        release: "ssd"
        chart: "ssd-2024.12.00"
      annotations:
    spec:
      serviceAccountName: token-machine
      containers:
        - name: token-machine
          image: quay.io/opsmxpublic/token-machine:2024-09-00
          ports:
            - containerPort: 8099
              protocol: TCP
          env:
          - name: KUBERNETES_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          volumeMounts:
            - name: config-volume
              mountPath: /opsmx/config/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Always
      volumes:
        - name: config-volume
          configMap:
            name: token-machine
