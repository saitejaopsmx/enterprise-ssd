apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplychain-api
  labels:
    app: ssd
    component: supplychain-api
{{ include "ssd.standard-labels" . | indent 4 }}
  name: supplychain-api
spec:
  replicas: {{ .Values.supplychainapi.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: supplychain-api
  template:
    metadata:
      labels:
        app: ssd
        component: supplychain-api
{{ include "ssd.standard-labels" . | indent 8 }}
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/supplychain-api/supplychain-api-cm.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/supplychain-api/supplychain-api-secret.yaml") . | sha256sum }}
{{- if .Values.supplychainapi.annotations -}}
        {{ toYaml .Values.supplychainapi.annotations | nindent 8 }}
{{- end }}
    spec:
      {{- if and (not .Values.minio.enabled) .Values.toolchain.iamrole }}
      serviceAccountName: ssd-storage-sa
      {{- else if .Values.global.gkeworkload }}
      serviceAccountName: ssd-workload-sa
      {{- end }}
      initContainers:
      - name: rabbitmq-check
        image: {{ template "initcontainer.images" . }}
        command:
          - sh
          - -c
          - |
            echo 'Waiting for RABBITMQ-SERVICE to become ready...'
            until printf "." && nc -z -w 2 rabbitmq-service 5672; do
               sleep 2;
            done;
            echo 'RABBITMQ-SERVICE OK ✓'
      containers:
        - name: supplychain-api
          image: {{ template "supplychainapi.image" . }}
          ports:
            - containerPort: 8099
              protocol: TCP
          env:
          {{- if .Values.minio.enabled }}
          - name: S3_ENDPOINT_URL
            value: http://{{ .Release.Name }}-minio:9000
          {{- else }}
          - name: S3_ENDPOINT_URL
            value: {{ .Values.s3bucketurl }}
          - name: S3_Region
            value: {{ .Values.s3region }}
          {{- end }}
          {{- if .Values.minio.enabled }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: username
                name: minio-secret
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: password
                name: minio-secret
          {{- else if and (eq .Values.toolchain.iamrole false) (not .Values.minio.enabled) }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: accesskey
                name: ssd-storage-secret
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: secretkey
                name: ssd-storage-secret
          {{- end }}
          - name: RABBITMQ_HOST
            value: rabbitmq-service
          - name: RABBITMQ_PORT
            value: "5672"
          - name: Cypher_Key
            valueFrom:
              secretKeyRef:
                key: AESEncryptionKey
                name: ssdsecret
          - name: RABBITMQ_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: rabbitmq-secret
          - name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: rabbitmq-secret
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: redis-secret
          - name: OAUTH_BRIDGE_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                key: oauth-private-key
                name: oauth-bridge-client-secrets
                optional: true
          envFrom:
          - configMapRef:
              name: ssd-proxy-certs
              optional: true
          - configMapRef:
              name: ssd-audit-emitter-config
              optional: true
          - configMapRef:
              name: oauth-bridge-client-config
          {{- with .Values.supplychainapi.probes }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8099
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /healthz
              port: 8099
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          {{- end }}
          volumeMounts:
            - mountPath: /app/ssd-public-keys
              name: ssd-public-keys
            - name: supplychain-api-volume
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml
            - mountPath: /app/config
              name: supplychain-api-cm
            - mountPath: /app/project.yaml
              name: adhoc-project-cm
              subPath: project.yaml
            - mountPath: /app/secrets/
              name: ssdsecret
              readOnly: true
            - mountPath: /usr/local/share/ca-certificates
              name: custom-certs
            - mountPath: /app/secrets/supplychain-api-token/
              name: token
              readOnly: true
            - mountPath: /app/zapOpenApiSpec
              name: zap-openapi-spec
            - mountPath: /app/zapPostmanCollection
              name: zap-postman-collection
            - mountPath: /app/policy
              name: policy
            - name: service-account
              readOnly: true
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          {{- with .Values.supplychainapi.resources }}
          resources:
            {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
      {{- if .Values.supplychainapi.securityContext }}
      {{ toYaml .Values.supplychainapi.securityContext | nindent 12 }}
      {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- end }}

        - name: gotenberg
          image: gotenberg/gotenberg:8.36.0-chromium
          command: ["gotenberg"]
          args: ["--api-port=3000"]
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
{{ include "otel.sidecar.container" . | indent 8 }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - emptyDir: {}
          name: zap-openapi-spec
        - emptyDir: {}
          name: policy
        - emptyDir: {}
          name: logs
        - emptyDir: {}
          name: zap-postman-collection
        - configMap:
            defaultMode: 420
            name: ssd-public-keys
          name: ssd-public-keys
        - name: supplychain-api-volume
          secret:
            secretName: supplychain-api
            items:
              - key: app-config.yaml
                path: app-config.yaml
            defaultMode: 420
        - configMap:
            defaultMode: 420
            items:
            - key: ssd-integrations.yaml
              path: ssd-integrations.yaml
            - key: ssd-whitelist.yaml
              path: ssd-whitelist.yaml
            name: supplychain-api-cm
          name: supplychain-api-cm
        - name: ssdsecret
          secret:
            defaultMode: 420
            items:
            - key: AESEncryptionKey
              path: ssdsecret/AESEncryptionKey
            secretName: ssdsecret
        - name: ssd-proxy-certs
          configMap:
            defaultMode: 420
            optional: true
            name: ssd-proxy-certs
        - name: token
          secret:
            defaultMode: 420
            secretName: supplychain-api-token
        - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
          configMap:
            defaultMode: 420
            items:
            - key: ca.crt
              path: ca.crt
            optional: true
            name: customer-custon-ca
        - name: service-account
          projected:
            sources:
              - serviceAccountToken:
                  audience: ssdopsmxadmin
                  expirationSeconds: 3600
                  path: token
            defaultMode: 420
        - name: adhoc-project-cm
          configMap:
            defaultMode: 420
            items:
            - key: project.yaml
              path: project.yaml
            optional: true
            name: adhoc-project-cm
        - name: otel-sidecar-volume
          configMap:
            name: otel-sidecar-config
            defaultMode: 420
