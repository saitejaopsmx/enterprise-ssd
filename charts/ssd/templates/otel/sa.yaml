apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-{{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-role-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/proxy
      - nodes/metrics
      - nodes
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-rolebinding
subjects:
  - kind: ServiceAccount
    name: otel-collector-{{ .Release.Namespace }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: otel-collector-role-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
