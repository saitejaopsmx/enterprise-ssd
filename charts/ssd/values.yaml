###############################################################################################
#### The values below this line are best not changed except in rare situations
###############################################################################################
dex:
  rbac:
    create: false
    createClusterScoped: false
  configSecret:
    create: false
    name: "gate-dex-config"
  volumeMounts:
  - mountPath: /okta
    name: dex-okta-pem
    readOnly: true
  - mountPath: /google
    name: google-json
    readOnly: true
  - mountPath: /srv/dex/web/templates/header.html
    name: dex-templates
    readOnly: true
    subPath: header.html
  - mountPath: /srv/dex/web/templates/footer.html
    name: dex-templates
    readOnly: true
    subPath: footer.html
  - mountPath: /srv/dex/web/templates/login.html
    name: dex-templates
    readOnly: true
    subPath: login.html
  - mountPath: /srv/dex/web/templates/password.html
    name: dex-templates
    readOnly: true
    subPath: password.html
  - mountPath: /srv/dex/web/templates/error.html
    name: dex-templates
    readOnly: true
    subPath: error.html

  volumes:
    - name: gate-dex-client-secret
      secret:
        defaultMode: 420
        secretName: gate-dex-client-secret
        optional: true
    - name: dex-okta-pem
      secret:
        defaultMode: 420
        secretName: dex-okta-pem
        optional: true
    - name: google-json
      secret:
        defaultMode: 420
        items:
        - key: googleAuth.json
          path: googleAuth.json
        secretName: dex-google-groups-auth
        optional: true
    - name: dex-templates
      configMap:
        defaultMode: 420
        items:
        - key: header.html
          path: header.html
        - key: footer.html
          path: footer.html
        - key: login.html
          path: login.html
        - key: password.html
          path: password.html
        - key: error.html
          path: error.html
        name: dex-templates
  env:
    - name: GATE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: gate-dex-client-secret
          key: client-secret
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
###############################################################################################
###  Redis Configuration
###############################################################################################
## Details of redis-master image for OES
redis:
  image:
    registry: quay.io
    repository: opsmxpublic/bitnami-redis
    tag: 8.0.2-debian-12-r3
  architecture: standalone
  auth:
    enabled: true
    sentinel: false
    existingSecret: "redis-secret"
    existingSecretPasswordKey: "password"
    usePasswordFiles: false
    usePasswordFileFromSecret: false

  master:
    persistence:
      storageClass: ""
    affinity: {}
    tolerations: []
    resources: {}

  # External Redis option will be enabled if in-cluster redis is disabled
  #  externalMaster:
  #  enabled: false
  #  host: ""
  #  port: 6379
  #nodeSelector: {}

  ##
  #configmap: |-
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    #  appendonly no
    # Disable RDB persistence, AOF persistence already enabled.
    #   save 60 1000

  # Uncomment if you don't want to create a PVC for redis
  #  master:
  #    persistence:
  #      enabled: false
#########################################################################
temporal:
  server:
    image:
      repository: quay.io/opsmxpublic/temporal-server
      tag: 1.27.2
    replicaCount: 1
    resources: {}
    config:
      persistence:
        default:
          driver: "sql"

          sql:
            driver: "postgres12"
            host: ssd-db
            port: "5432"
            database: temporal
            user: postgres
          # for a production deployment use this instead of `password` and provision the secret beforehand e.g. with a sealed secret
          # it has a single key called `password`
            existingSecret: temporal-default-store
            maxConns: 20
            maxConnLifetime: "1h"
          # tls:
          #  enabled: true
          #  enableHostVerification: true
          #  serverName: _HOST_ # this is strictly required when using serverless CRDB offerings

        visibility:
          driver: "sql"

          sql:
            driver: "postgres12"
            host: ssd-db
            port: "5432"
            database: temporal_visibility
            user: postgres
          # for a production deployment use this instead of `password` and provision the secret beforehand e.g. with a sealed secret
          # it has a single key called `password`
            existingSecret: temporal-visibility-store
            maxConns: 20
            maxConnLifetime: "1h"
          # tls:
          #  enabled: true
          #  enableHostVerification: true
          #  serverName: _HOST_ # this is strictly required when using serverless CRDB offerings

    frontend:
      resources: {}
      podDisruptionBudget: {}
    history:
      resources: {}
      podDisruptionBudget: {}
    worker:
      resources: {}
      podDisruptionBudget: {}
    matching:
      resources: {}
      podDisruptionBudget: {}


  web:
