{ rule: "query($groups: [String!]) { querySecurityIssue @cascade { policyEnforcements { enforcedOrg { teams { roles(filter: {group: {in: $groups}, permission: {in: [admin,alert_update]}}) { __typename }}}}}}"},
{ rule: "query($groups: [String!]) { querySecurityIssue @cascade { policyEnforcements { enforcedTeam { roles(filter: {group: {in: $groups}, permission: {in: [admin,alert_update]}}) { __typename }}}}}"},
{ rule: "query($groups: [String!]) { querySecurityIssue @cascade { policyEnforcements { enforcedApplication { roles(filter: {group: {in: $groups}, permission: {in: [admin,alert_update]}}) { __typename }}}}}"},
