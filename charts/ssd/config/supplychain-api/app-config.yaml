ssdIngress: {{.Values.global.ssdUI.protocol}}://{{.Values.global.ssdUI.host}}
detectorImage: {{ template "kubedetector.image" . }}
kubescapeImage: {{ template "kubescape.image" . }}
ssdRescheduler: http://ssd-rescheduler:8010
tokenMachine:
    host: http://token-machine
    port: 8050
opsMxSvc: {{.Values.global.ssdUI.protocol}}://{{.Values.global.ssdUI.host}}
ssdOpa: http://ssd-opa:8200
gotenberg: http://localhost:3000
zapService: http://zap-service:8080
redis: {{ template "ssd.redisBaseURL" . }}
graphqlsvc:
    {{- if .Values.dgraph.HA.enabled }}
    host: http://dgraph-alpha-public
    {{- else }}
    host: http://dgraph-public
    {{- end }}
    port: 8080
postgresql:
    ssd:
      connectString: host={{ .Values.db.host }} user='{{ .Values.db.username }}'  password='{{ .Values.db.password }}' database=ssddb port={{ .Values.db.port }}
toolchain:
    host: http://tool-chain
    port: 8100
spinnaker:
    rabbitmq:
      username: '{{ .Values.rabbitmq.username }}'
      password: '{{ .Values.rabbitmq.password }}'
      host: rabbitmq-service
      port: 5672
      queue: preview-saas-ssd
      #queue: isd-to-preview-saas
      exchange: echo.events
      bindingKey: preview-saas-ssd
projectMonitor:
    host: http://project-monitor-service
    port: 9090
policy:
    repoURL: "https://github.com/OpsMx/ssd-policies.git"
    pullReferenceName: "main"
    pullReferenceType: "branch"
    pollingTime: 1
