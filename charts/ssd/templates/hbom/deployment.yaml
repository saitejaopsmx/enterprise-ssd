apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbom-generator
  labels:
    app: ssd
    component: hbom-generator
{{ include "ssd.standard-labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      app: ssd
      component: hbom-generator
  template:
    metadata:
      labels:
        app: ssd
        component: hbom-generator
{{ include "ssd.standard-labels" . | indent 8 }}
      annotations:
{{- if .Values.hbom.annotations -}}
        {{ toYaml .Values.hbom.annotations | nindent 8 }}
{{- end }}
    spec:
      {{- if and (not .Values.minio.enabled) .Values.toolchain.iamrole }}
      serviceAccountName: ssd-storage-sa
      {{- end }}
      containers:
        - name: hbom-generator
          image: {{ template "hbom.image" . }}
          env:
          {{- if .Values.minio.enabled }}
          - name: S3_ENDPOINT_URL
            value: "http://{{ .Release.Name }}-minio:9000"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: username
                name: minio-secret
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: password
                name: minio-secret
          {{- else if and (eq .Values.toolchain.iamrole false) (not .Values.minio.enabled) }}
          - name: S3_ENDPOINT_URL
            value: {{ .Values.s3bucketurl }}
          - name: S3_Region
            value: {{ .Values.s3region }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: accesskey
                name: ssd-storage-secret
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: secretkey
                name: ssd-storage-secret
          {{- end }}
          envFrom:
            - configMapRef:
                name: hbom-generator-config
                optional: true
            - secretRef:
                name: hbom-generator-secrets
                optional: true
          volumeMounts:
            - name: ssd-public-keys
              mountPath: /app/ssd-public-keys
            - name: hbom-generator-token
              mountPath: /app/secrets/hbom-generator
              readOnly: true
            - name: gateway-ca-cert
              readOnly: true
              mountPath: /app/certs/gateway
      {{- with .Values.hbom.resources }}
          resources:
      {{- toYaml . | nindent 12 }}
      {{- end }}
          securityContext:
      {{- if .Values.hbom.securityContext }}
      {{ toYaml .Values.hbom.securityContext | nindent 12 }}
      {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
      volumes:
        - configMap:
            defaultMode: 420
            name: ssd-public-keys
          name: ssd-public-keys
        - name: token
          secret:
            defaultMode: 420
            secretName: hbom-generator-token
        - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
          configMap:
            defaultMode: 420
            items:
            - key: ca.crt
              path: ca.crt
            optional: true
            name: customer-custom-ca
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
