---
# Source: ssd/templates/ssd-db/ssd-db-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: ssd
    component: db
    heritage: "Helm"
    release: "ssd"
    chart: "ssd-2024.12.00"
  name: ssd-db
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  serviceName: ssd-db
  selector:
    matchLabels:
      app: ssd
      component: db
  template:
    metadata:
      annotations:
      labels:
        app: ssd
        component: db
    spec:
      containers:
      - image: quay.io/opsmxpublic/ssd-db:2024-05-00
        imagePullPolicy: IfNotPresent
        name: ssd-db
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - /opt/opsmx/bin/stop.sh
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - mountPath: "/var/lib/pgsql-pv"
          name: ssd-db-postgresql
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 5
      securityContext:
      
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      creationTimestamp: null
      labels:
        app: ssd
        component: db
      name: ssd-db-postgresql
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      volumeMode: Filesystem
