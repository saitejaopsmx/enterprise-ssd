apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplychain-preprocessor
  labels:
    app: ssd
    component: supplychain-preprocessor
{{ include "ssd.standard-labels" . | indent 4 }}
spec:
  replicas: {{ .Values.supplychainpreprocessor.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: supplychain-preprocessor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ssd
        component: supplychain-preprocessor
{{ include "ssd.standard-labels" . | indent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/supplychain-preprocessor/ssd-preprocessor-secret.yaml") . | sha256sum }}
{{- if .Values.supplychainpreprocessor.annotations -}}
        {{ toYaml .Values.supplychainpreprocessor.annotations | nindent 8 }}
{{- end }}
    spec:
      initContainers:
      - name: rabbitmq-check
        image: {{ template "initcontainer.images" . }}
        command:
          - sh
          - -c
          - |
            echo 'Waiting for RABBITMQ-SERVICE to become ready...'
            until printf "." && nc -z -w 2 rabbitmq-service 5672; do
               sleep 2;
            done;
            echo 'RABBITMQ-SERVICE OK ✓'
      containers:
      - name: supplychain-preprocessor
        image: {{ template "supplychainpreprocessor.image" . }}
        env:
        - name: RABBITMQ_HOST
          value: rabbitmq-service
        - name: RABBITMQ_PORT
          value: "5672"
        - name: REDIS_ADDRESS
          value: {{ .Release.Name }}-redis-master:6379
        - name: REDIS_DB
          value: "0"
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-secret
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-secret
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: redis-secret
        envFrom:
        - configMapRef:
            name: ssd-proxy-certs
            optional: true
        volumeMounts:
        - mountPath: /etc/ssd-public-keys
          name: ssd-public-keys
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/config
          name: preprocessor-volume
        - mountPath: /etc/secrets/
          name: ssdsecret
          readOnly: true
        - mountPath: /etc/secrets/supplychain-preprocessor-token/
          name: token
          readOnly: true
        - mountPath: /usr/local/share/ca-certificates
          name: custom-certs
        - mountPath: /app/scanResult
          name: scanresult
        - mountPath: /app/grypeDB
          name: grypedb
        {{- with .Values.supplychainpreprocessor.probes }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8058
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 8058
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        {{- end }}
      {{- with .Values.supplychainpreprocessor.resources }}
        resources:
      {{- toYaml . | nindent 10 }}
      {{- end }}
        securityContext:
      {{- if .Values.supplychainpreprocessor.securityContext }}
      {{ toYaml .Values.supplychainpreprocessor.securityContext | nindent 12 }}
      {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- end }}


      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: ssd-public-keys
        name: ssd-public-keys
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: scanresult
      - emptyDir: {}
        name: grypedb
      - name: preprocessor-volume
        secret:
          secretName: supplychain-preprocessor
      - name: ssdsecret
        secret:
          defaultMode: 420
          items:
          - key: AESEncryptionKey
            path: ssdsecret/AESEncryptionKey
          secretName: ssdsecret
      - name: ssd-proxy-certs
        configMap:
          defaultMode: 420
          optional: true
          name: ssd-proxy-certs
      - name: token
        secret:
          defaultMode: 420
          secretName: supplychain-preprocessor-token
      - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
        configMap:
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
          optional: true
          name: customer-custon-ca
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
