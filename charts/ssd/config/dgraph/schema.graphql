{ rule: "query($groups: [String!]) { queryTeam @cascade { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle,adhoc_create_delete,adhoc_update,adhoc_trigger_scan,exception_add,exception_update,cluster_add,cluster_update,component_license_update,team_manage,alert_update,policy_update,report_subscription_create_delete,report_subscription_update,read]}}) { __typename }}}}"},
{ rule: "query($groups: [String!]) { queryTeam @cascade { applications { roles(filter: {group: {in: $groups}, permission: {in: [admin,integrator_create_delete,integrator_update,integrator_toggle,adhoc_create_delete,adhoc_update,adhoc_trigger_scan,exception_add,exception_update,cluster_add,cluster_update,component_license_update,team_manage,alert_update,policy_update,report_subscription_create_delete,report_subscription_update,read]}}) { __typename }}}}"},
    ]},
    add: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryTeam @cascade { roles(filter: {group: {in: $groups}, permission: {in: [admin,team_manage]}}) { __typename }}}"},
{ rule: "query($groups: [String!]) { queryTeam @cascade { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,team_manage]}}) { __typename }}}}"},
    ]},
    update: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryTeam @cascade { roles(filter: {group: {in: $groups}, permission: {in: [admin,team_manage]}}) { __typename }}}"},
{ rule: "query($groups: [String!]) { queryTeam @cascade { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,team_manage]}}) { __typename }}}}"},
