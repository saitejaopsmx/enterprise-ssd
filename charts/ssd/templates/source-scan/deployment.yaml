apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-scan
  labels:
    app: ssd
    component: source-scan
{{ include "ssd.standard-labels" . | indent 4 }}
spec:
  replicas: {{ .Values.sourcescan.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: source-scan
  template:
    metadata:
      labels:
        app: ssd
        component: source-scan
{{- if .Values.customLabels }}
{{ toYaml .Values.customLabels | indent 8}}
{{- end }}
      annotations:
{{- if .Values.sourcescan.annotations -}}
        {{ toYaml .Values.sourcescan.annotations | nindent 8 }}
{{- end }}
    spec:
      containers:
        - name: source-scan
          image: {{ template "sourcescan.image" . }}
          volumeMounts:
            - name: ssd-public-keys
              mountPath: /app/ssd-public-keys
            - name: ssdsecret
              readOnly: true
              mountPath: /app/secrets/
            - name: scanresult
              mountPath: /app/scanResult
            - name: scan-config
              mountPath: /app/config/source-scan.yaml
              subPath: source-scan.yaml
            - name: custom-certs
              mountPath: /usr/local/share/ca-certificates
            - name: token
              readOnly: true
              mountPath: /app/secrets/source-scan-token
            - name: tempdir
              mountPath: /app/temp
          {{- with .Values.sourcescan.resources }}
          resources:
          {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
      {{- if .Values.sourcescan.securityContext }}
      {{ toYaml .Values.sourcescan.securityContext | nindent 12 }}
      {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      volumes:
        - name: ssdsecret
          secret:
            secretName: ssdsecret
            items:
              - key: AESEncryptionKey
                path: ssdsecret/AESEncryptionKey
            defaultMode: 420
        - name: ssd-proxy-certs
          configMap:
            name: ssd-proxy-certs
            defaultMode: 420
            optional: true
        - name: custom-certs
          configMap:
            name: customer-custon-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
            optional: true
        - name: ssd-public-keys
          configMap:
            name: ssd-public-keys
            defaultMode: 420
        - name: token
          secret:
            optional: true
            secretName: source-scan-token
        - name: scanresult
          emptyDir: {}
        - name: tempdir
          emptyDir: {}
        - name: scan-config
          configMap:
            name: source-scan-config
            items:
              - key: source-scan.yaml
                path: source-scan.yaml
            defaultMode: 420

      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
