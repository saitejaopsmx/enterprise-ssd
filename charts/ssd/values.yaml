#################################################################################
### Below is the Node Selector,Tolerations,Affinity for all SSD Components ######
#################################################################################
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

###############################################################################################
#### The values below this line are best not changed except in rare situations
###############################################################################################
dex:
  configSecret:
    create: false
    name: "gate-dex-config"
  volumes:
    - name: gate-dex-client-secret
      secret:
        defaultMode: 420
        secretName: gate-dex-client-secret
  env:
    - name: GATE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: gate-dex-client-secret
          key: client-secret
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
###############################################################################################
###  Redis Configuration
###############################################################################################
## Details of redis-master image for OES
redis:
  ## Redis endpoint that is used by oes-gate and oes-platform for caching;
  ## Change this to custom URL if installRedis is set to false
  ## url: redis://{{ .Release.Name }}-redis-master:6379
  #url: redis://:password@{{ .Release.Name }}-redis-master
  port: 6379
  image:
    registry: quay.io/opsmxpublic
    repository: bitnami-redis
    tag: "2024-05-00"
  password: 12345sdfa
  cluster:
    enabled: false
  securityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001

  # External Redis option will be enabled if in-cluster redis is disabled
  external:
    host: "<EXTERNAL-REDIS-HOST-NAME>"
    port: 6379
    # password: ""
  nodeSelector: {}
  master:
    persistence:
      storageClass: ""
    affinity: {}
    tolerations: []
    resources: {}

  ## Redis config file
  ## ref: https://redis.io/topics/config
  ##
  configmap: |-
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    appendonly no
    # Disable RDB persistence, AOF persistence already enabled.
    save 60 1000

  # Uncomment if you don't want to create a PVC for redis
  #  master:
  #    persistence:
  #      enabled: false
#########################################################################
temporal:
  server:
    image:
      repository: quay.io/opsmxpublic/temporal-server
      tag: 1.20.3
    replicaCount: 1
    resources: {}
    config:
      persistence:
        default:
          driver: "sql"

          sql:
            driver: "postgres"
            host: ssd-db
            port: "5432"
            database: temporal
            user: postgres
            password: networks123
          # for a production deployment use this instead of `password` and provision the secret beforehand e.g. with a sealed secret
          # it has a single key called `password`
          # existingSecret: temporal-default-store
            maxConns: 20
            maxConnLifetime: "1h"
          # tls:
          #  enabled: true
          #  enableHostVerification: true
          #  serverName: _HOST_ # this is strictly required when using serverless CRDB offerings

        visibility:
          driver: "sql"

          sql:
            driver: "postgres"
            host: ssd-db
            port: "5432"
            database: temporal_visibility
            user: postgres
            password: networks123
          # for a production deployment use this instead of `password` and provision the secret beforehand e.g. with a sealed secret
          # it has a single key called `password`
          # existingSecret: temporal-visibility-store
            maxConns: 20
            maxConnLifetime: "1h"
          # tls:
          #  enabled: true
          #  enableHostVerification: true
          #  serverName: _HOST_ # this is strictly required when using serverless CRDB offerings

    frontend:
      resources: {}
      podDisruptionBudget: {}
    history:
      resources: {}
      podDisruptionBudget: {}
    worker:
      resources: {}
      podDisruptionBudget: {}
    matching:
      resources: {}
      podDisruptionBudget: {}


  web:
    image:
      repository: quay.io/opsmxpublic/temporal-ui
      tag: 2.9.0
    replicaCount: 1
    resources: {}

  admintools:
    enabled: true
    image:
      repository: quay.io/opsmxpublic/temporal-admin-tools
      tag: 1.20.3
    resources: {}
    podDisruptionBudget: {}


  cassandra:
    enabled: false

  mysql:
    enabled: false

  postgresql:
    enabled: true

  prometheus:
    enabled: false

  grafana:
    enabled: false

  elasticsearch:
    enabled: false

  schema:
    setup:
      enabled: false
    update:
      enabled: false
