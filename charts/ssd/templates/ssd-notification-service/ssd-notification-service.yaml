apiVersion: v1
kind: Service
metadata:
  name: ssd-notification
  labels:
    app: ssd
    component: ssd-notification
{{ include "ssd.standard-labels" . | indent 4 }}
{{- if .Values.ssdnotificationservice.serviceAnnotations }}
  annotations:
{{ toYaml .Values.ssdnotificationservice.serviceAnnotations | indent 4 }}
{{- end }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: 9091
      targetPort: 9091
      {{- if eq .Values.k8sServiceType "NodePort" }}
      nodePort: 9091
      {{- end }}
  selector:
    app: ssd
    component: ssd-notification
