apiVersion: v1
kind: Service
metadata:
  name: project-monitor-service
  labels:
    app: ssd
    component: project-monitor
{{ include "ssd.standard-labels" . | indent 4 }}
{{- if .Values.projectmonitor.serviceAnnotations }}
  annotations:
{{ toYaml .Values.projectmonitor.serviceAnnotations | indent 4 }}
{{- end }}
spec:
  ports:
    - name: project-monitor
      protocol: TCP
      port: 9090
      targetPort: 9090
  selector:
    app: ssd
    component: project-monitor
