<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700|Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "ssd_base_url" | extra }}/static/dex-login.css">
    <title>{{ issuer }}</title>
</head>
<body>
    <div class="opsmx-container">
        <!-- Left Section - Branding -->
        <div class="opsmx-left-section">
            <h1>"All-in-One" Code to Cloud Security</h1>
            <p>OpsMx Delivery Shield provides simpler and cost effective Application Security powered by best open source security tools</p>
            <img class="opsmx-illustration" src="{{ "ssd_base_url" | extra }}/static/SSD.webp" alt="Dashboard Illustration" />
        </div>
        <!-- Right Section - Error Display -->
        <div class="opsmx-right-section">
            <div class="opsmx-form-container">
                <img class="opsmx-logo" src="{{ "ssd_base_url" | extra }}/static/OpsMx_Logo_White.svg" alt="OpsMx Logo" />
                <div class="opsmx-login-form">
                    <h2 class="opsmx-heading opsmx-error-heading">{{ .ErrType }}</h2>
                    <div class="opsmx-error-panel">
                        <p class="opsmx-error-message">{{ .ErrMsg }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
