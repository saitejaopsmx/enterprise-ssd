{{- if .Values.installAimlSvcs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlvs
  labels:
    app: ssd
    component: dlvs
{{ include "ssd.standard-labels" . | indent 4 }}
spec:
  replicas: {{ .Values.dlvs.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: dlvs
  template:
    metadata:
      labels:
        app: ssd
        component: dlvs
{{ include "ssd.standard-labels" . | indent 8 }}
      annotations:
{{- if .Values.dlvs.annotations -}}
        {{ toYaml .Values.dlvs.annotations | nindent 8 }}
{{- end }}
    spec:
      containers:
        - name: dlvs
          image: {{ template "dlvs.image" . }}
          ports:
            - containerPort: 5000
              protocol: TCP
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: dlvs-hf-cache
          volumeMounts:
            - name: hf-cache
              mountPath: /home/dlvs/.cache
      {{- with .Values.dlvs.resources }}
          resources:
      {{- toYaml . | nindent 12 }}
      {{- end }}
          securityContext:
{{ toYaml (default (dict "fsGroup" 10111) .Values.dlvs.securityContext) | indent 12 }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
