    labels: [KeyValue!]
    policies: [PolicyDefinition!] @hasInverse(field: ownerTeam)
    policyEnforcements: [PolicyEnforcement!]
    ruleScopes: [RuleScope!] @hasInverse(field: team)
    exceptions: [ExceptionAffects!] @hasInverse(field: affectsTeam)
    integratorConfigs: [IntegratorConfigs!] @hasInverse(field: team)
    AttachedJira: [Jira] @hasInverse(field: team)
    projects: [Project!] @hasInverse(field: team)
    reportSubscriptions: [ReportSubscriptionAffects!] @hasInverse(field: affectsTeam)
    shieldAgents: [ShieldAgent!] @hasInverse(field: team)
}

enum ShieldAgentState {
    registered
    connected
    disconnected
    unhealthy
}

type ShieldAgent
    @auth(
    query: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryShieldAgent @cascade { team { roles(filter: {group: {in: $groups}, permission: {in: [admin,read]}}) { __typename }}}}"},
{ rule: "query($groups: [String!]) { queryShieldAgent @cascade { team { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin,read]}}) { __typename }}}}}"},
        ]
    },
    add: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryShieldAgent @cascade { team { roles(filter: {group: {in: $groups}, permission: {in: [admin]}}) { __typename }}}}"},
{ rule: "query($groups: [String!]) { queryShieldAgent @cascade { team { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin]}}) { __typename }}}}}"},
        ]
    },
    update: {
        or: [
            { rule: "{$type: {eq: \"internal-account/v1\"}}" },
{ rule: "query($groups: [String!]) { queryShieldAgent @cascade { team { roles(filter: {group: {in: $groups}, permission: {in: [admin]}}) { __typename }}}}"},
{ rule: "query($groups: [String!]) { queryShieldAgent @cascade { team { organization { roles(filter: {group: {in: $groups}, permission: {in: [admin]}}) { __typename }}}}}"},
        ]
    },
